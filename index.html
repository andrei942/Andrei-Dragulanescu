<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AD Tiling</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: url("images/bathroom.png") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.55);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
        }

        .call-btn {
            background: gold;
            color: #000;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
        }

        .call-btn:hover {
            background: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <div class="content">
            <h1>AD TILING</h1>
            <p>Professional Bathroom & Tile Installation</p>

            <a class="call-btn" href="tel:07917635041">
                📞 Call 07917 635041
            </a>
        </div>
    </div>

</body>
</html>
